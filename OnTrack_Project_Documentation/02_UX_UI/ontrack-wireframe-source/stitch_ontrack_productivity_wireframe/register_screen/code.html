<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
        }
        .soft-shadow {
            shadow: 0 4px 12px rgba(0,0,0, 0.05);
        }
        .bg-mesh {
            background-color: #f9f9f9;
            background-image: radial-gradient(at 0% 0%, rgba(0, 88, 190, 0.03) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(107, 56, 212, 0.03) 0px, transparent 50%);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#f9f9f9",
                        "on-primary-container": "#fefcff",
                        "surface-tint": "#005ac2",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#adc6ff",
                        "surface-container": "#eeeeee",
                        "primary": "#0058be",
                        "secondary-container": "#62fae3",
                        "secondary": "#006b5f",
                        "on-primary-fixed": "#001a42",
                        "surface-container-low": "#f3f3f3",
                        "tertiary-container": "#8455ef",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#727785",
                        "on-secondary-fixed": "#00201c",
                        "surface-dim": "#dadada",
                        "inverse-primary": "#adc6ff",
                        "on-surface-variant": "#424754",
                        "tertiary-fixed-dim": "#d0bcff",
                        "on-secondary-container": "#007165",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "outline-variant": "#c2c6d6",
                        "tertiary": "#6b38d4",
                        "inverse-on-surface": "#f0f1f1",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#fffbff",
                        "secondary-fixed-dim": "#3cddc7",
                        "on-background": "#1a1c1c",
                        "surface-container-highest": "#e2e2e2",
                        "on-surface": "#1a1c1c",
                        "primary-fixed": "#d8e2ff",
                        "on-tertiary-fixed": "#23005c",
                        "surface-bright": "#f9f9f9",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#004395",
                        "on-primary": "#ffffff",
                        "primary-container": "#2170e4",
                        "inverse-surface": "#2f3131",
                        "tertiary-fixed": "#e9ddff",
                        "surface": "#f9f9f9",
                        "on-secondary-fixed-variant": "#005047",
                        "surface-variant": "#e2e2e2",
                        "surface-container-high": "#e8e8e8",
                        "secondary-fixed": "#62fae3",
                        "on-tertiary-fixed-variant": "#5516be"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "container-padding": "20px",
                        "stack-gap-md": "16px",
                        "stack-gap-sm": "8px",
                        "gutter": "12px",
                        "stack-gap-lg": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "title-md": ["Inter"],
                        "display": ["Inter"],
                        "caption": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "title-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "display": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background min-h-screen flex flex-col items-center selection:bg-primary-fixed">
<!-- Top App Bar (Simplified for Auth) -->
<header class="w-full top-0 sticky bg-background flex justify-between items-center px-container-padding h-16 w-full max-w-md mx-auto z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">track_changes</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">OnTrack</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md px-container-padding flex flex-col pt-stack-gap-lg pb-stack-gap-lg bg-mesh overflow-y-auto">
<!-- Welcome Message -->
<div class="mb-stack-gap-lg text-left">
<h2 class="font-display text-display text-on-background mb-2">Join us</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Your journey to academic clarity starts here. Create your account.</p>
</div>
<!-- Registration Form Card -->
<div class="bg-surface-container-lowest rounded-[24px] p-stack-gap-lg shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant/20">
<form class="space-y-stack-gap-lg" onsubmit="return false;">
<!-- Full Name Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider ml-1" for="name">Full Name</label>
<div class="relative">
<input class="w-full h-[52px] px-5 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary text-on-surface font-body-md transition-all" id="name" placeholder="Enter your full name" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider ml-1" for="email">Student Email</label>
<div class="relative">
<input class="w-full h-[52px] px-5 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary text-on-surface font-body-md transition-all" id="email" placeholder="example@university.edu" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider ml-1" for="password">Password</label>
<div class="relative">
<input class="w-full h-[52px] px-5 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary text-on-surface font-body-md transition-all" id="password" placeholder="Min. 8 characters" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider ml-1" for="confirm_password">Confirm Password</label>
<div class="relative">
<input class="w-full h-[52px] px-5 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary text-on-surface font-body-md transition-all" id="confirm_password" placeholder="Re-enter password" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-[56px] mt-4 bg-primary text-on-primary rounded-xl font-title-md text-title-md hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-lg shadow-primary/20" type="submit">
                    Register
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Secondary Actions & Links -->
<div class="mt-stack-gap-lg flex flex-col items-center space-y-4">
<a class="font-body-md text-body-md text-primary font-semibold hover:underline flex items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
                Back to Login
            </a>
<div class="flex items-center gap-4 w-full">
<div class="h-[1px] bg-outline-variant flex-1"></div>
<span class="text-caption font-caption text-outline">OR REGISTER WITH</span>
<div class="h-[1px] bg-outline-variant flex-1"></div>
</div>
<!-- Social Register Options -->
<div class="flex gap-4 w-full">
<button class="flex-1 h-12 rounded-xl bg-white border border-outline-variant/30 flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-95">
<img class="w-5 h-5" data-alt="A clean, minimalist vector icon of the Google 'G' logo, rendered in its authentic brand colors, set against a pristine white background. The style is modern, flat, and professional, perfectly suited for a high-end student productivity app interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJrnlNsobF-0VAU9MqH1-eQTTWAM_NCdJoK5OnljThzo894CIrk0-KG4WOOjHT6yq3-SOyOChUACdCYJ15DhJArYBWrqa1zxW1TlUBXbTJ-tlzyLpk_KwraDRmd1M_zeU-_tlEs8NPBQSYVBZHSB5OyVxp9qEcPGZyd3Yp5gubPWwtGdBOw8TruKlh4TYrW92O-SlRa7T2jhezZr53wwxpaRGgRA-jIwLePRMWOTmCiBbKaUd3iOuMlg"/>
</button>
<button class="flex-1 h-12 rounded-xl bg-white border border-outline-variant/30 flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface">school</span>
</button>
</div>
</div>
<!-- Academic Quote Decoration -->
<div class="mt-auto pt-12 pb-6 text-center">
<p class="font-caption text-caption text-outline italic">"The secret of getting ahead is getting started."</p>
</div>
</main>
<!-- Bottom Navigation Suppressed as per instructions (Transactional Screen) -->
<script>
        // Micro-interactions for input focus
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.querySelector('label').classList.remove('text-primary');
            });
        });

        // Simple password toggle logic
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            toggleBtn.querySelector('span').textContent = isPass ? 'visibility_off' : 'visibility';
        });
    </script>
</body></html>
