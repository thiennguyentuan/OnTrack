<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }

        /* Smooth breathing animation for the logo */
        @keyframes logo-breathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        .animate-breathe {
            animation: logo-breathe 4s ease-in-out infinite;
        }

        /* Progress loader bar animation */
        @keyframes progress-load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .loading-bar-fill {
            animation: progress-load 3s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        /* Fade in for text */
        @keyframes text-fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: text-fade-in 1s ease-out forwards;
        }
    </style>

<!-- Splash Screen Canvas -->
<main class="flex-1 flex flex-col items-center justify-center relative px-container-padding">

<p class="font-title-md text-title-md text-on-surface-variant max-w-[280px] animate-fade-up opacity-0" style="animation-delay: 0.5s;">
                Stay focused. Stay on track.
            </p>
</div>
<!-- Loading Indicator Section -->
<div class="absolute bottom-16 left-0 right-0 flex flex-col items-center px-container-padding">
<div class="w-full max-w-[240px] h-1.5 bg-surface-container rounded-full overflow-hidden">
<!-- Using Primary Blue for the fill per Design System -->
<div class="h-full bg-primary rounded-full loading-bar-fill"></div>
</div>
<span class="mt-stack-gap-sm font-label-md text-label-md text-outline uppercase tracking-widest animate-fade-up opacity-0" style="animation-delay: 0.8s;">
                Preparing your focus
            </span>
</div>
</main>
<!-- Interactions Script -->
<script>
        // Simulate a splash screen transition or simply keep it static as requested.
        // For a real app, this would redirect after the loading bar completes.
        document.addEventListener('DOMContentLoaded', () => {
            console.log('OnTrack Splash Screen Loaded');
            
            // Interaction: Tap to simulate finish
            document.body.addEventListener('click', () => {
                const bar = document.querySelector('.loading-bar-fill');
                if (bar) {
                    bar.style.transition = 'width 0.5s ease-out';
                    bar.style.width = '100%';
                }
            });
        });
    </script>
