<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OnTrack - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "background": "#f9f9f9",
                    "on-primary-container": "#fefcff",
                    "surface-tint": "#005ac2",
                    "on-tertiary": "#ffffff",
                    "primary-fixed-dim": "#adc6ff",
                    "surface-container": "#eeeeee",
                    "primary": "#0058be",
                    "secondary-container": "#62fae3",
                    "secondary": "#006b5f",
                    "on-primary-fixed": "#001a42",
                    "surface-container-low": "#f3f3f3",
                    "tertiary-container": "#8455ef",
                    "surface-container-lowest": "#ffffff",
                    "outline": "#727785",
                    "on-secondary-fixed": "#00201c",
                    "surface-dim": "#dadada",
                    "inverse-primary": "#adc6ff",
                    "on-surface-variant": "#424754",
                    "tertiary-fixed-dim": "#d0bcff",
                    "on-secondary-container": "#007165",
                    "on-secondary": "#ffffff",
                    "on-error-container": "#93000a",
                    "on-error": "#ffffff",
                    "outline-variant": "#c2c6d6",
                    "tertiary": "#6b38d4",
                    "inverse-on-surface": "#f0f1f1",
                    "error-container": "#ffdad6",
                    "on-tertiary-container": "#fffbff",
                    "secondary-fixed-dim": "#3cddc7",
                    "on-background": "#1a1c1c",
                    "surface-container-highest": "#e2e2e2",
                    "on-surface": "#1a1c1c",
                    "primary-fixed": "#d8e2ff",
                    "on-tertiary-fixed": "#23005c",
                    "surface-bright": "#f9f9f9",
                    "error": "#ba1a1a",
                    "on-primary-fixed-variant": "#004395",
                    "on-primary": "#ffffff",
                    "primary-container": "#2170e4",
                    "inverse-surface": "#2f3131",
                    "tertiary-fixed": "#e9ddff",
                    "surface": "#f9f9f9",
                    "on-secondary-fixed-variant": "#005047",
                    "surface-variant": "#e2e2e2",
                    "surface-container-high": "#e8e8e8",
                    "secondary-fixed": "#62fae3",
                    "on-tertiary-fixed-variant": "#5516be"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "unit": "4px",
                    "container-padding": "20px",
                    "stack-gap-md": "16px",
                    "stack-gap-sm": "8px",
                    "gutter": "12px",
                    "stack-gap-lg": "24px"
            },
            "fontFamily": {
                    "headline-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "title-md": ["Inter"],
                    "display": ["Inter"],
                    "caption": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-md": ["Inter"]
            },
            "fontSize": {
                    "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "title-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "display": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #f9f9f9;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-shadow {
            shadow: 0 4px 12px rgba(0,0,0,0.05);
        }
        .input-focus:focus-within {
            box-shadow: 0 0 0 2px #0058be;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-on-surface">
<!-- Top AppBar (Simplified for Login Context - Branding Only) -->
<header class="w-full top-0 sticky bg-background flex justify-center items-center h-20 px-container-padding z-40">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">track_changes</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">OnTrack</h1>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-container-padding pb-12">
<div class="w-full max-w-md animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Welcome Header -->
<div class="text-center mb-stack-gap-lg">
<h2 class="font-display text-display text-on-surface mb-2">Welcome back</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Focus on your goals, we'll handle the rest.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-[24px] p-8 shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-[#F1F5F9]">
<form class="flex flex-col gap-stack-gap-md" id="loginForm">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="email">Email Address</label>
<div class="relative group">
<input class="w-full h-[52px] px-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary text-on-surface transition-all placeholder:text-outline-variant" id="email" name="email" placeholder="name@university.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative group">
<input class="w-full h-[52px] px-4 pr-12 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary text-on-surface transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="mt-4 h-[52px] w-full bg-primary text-on-primary rounded-xl font-title-md text-title-md flex items-center justify-center gap-2 active:scale-95 transition-transform duration-150 shadow-sm" type="submit">
                        Login
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="mt-8 flex flex-col items-center gap-4">
<div class="flex items-center gap-2 w-full">
<div class="h-[1px] bg-outline-variant flex-grow"></div>
<span class="font-label-md text-label-md text-outline-variant">OR</span>
<div class="h-[1px] bg-outline-variant flex-grow"></div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">
                        New to OnTrack? 
                        <a class="text-primary font-bold hover:underline" href="#">Register now</a>
</p>
</div>
</div>
<!-- Visual Decoration / Bottom message -->
<div class="mt-12 text-center">
<div class="inline-flex items-center gap-2 px-4 py-2 bg-secondary-container/30 rounded-full border border-secondary-container/50">
<span class="material-symbols-outlined text-on-secondary-container text-sm" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-caption text-caption text-on-secondary-container">"The secret of getting ahead is getting started."</span>
</div>
</div>
</div>
</main>
<!-- Simple Footer for legal/links -->
<footer class="py-8 px-container-padding text-center">
<p class="font-caption text-caption text-outline-variant">
            © 2024 OnTrack Academic. Supportive, Organized, Quietly Encouraging.
        </p>
</footer>
<script>
        // Password visibility toggle logic
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');
        const eyeIcon = document.querySelector('#eyeIcon');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle icon text
            eyeIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Form submission micro-interaction
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = loginForm.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Logging in...';
            
            // Simulate navigation/auth
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Welcome';
                btn.classList.replace('bg-primary', 'bg-success-green'); // Note: using design system tokens would be better
                btn.style.backgroundColor = '#10B981'; // Success Green from brand guide
            }, 1000);
        });
    </script>
</body></html>
