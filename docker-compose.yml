services:
  postgres:
    image: postgres:16-alpine
    container_name: ontrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ontrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ontrack-postgres-data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  ontrack-postgres-data:
